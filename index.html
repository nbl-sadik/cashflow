/**
 * Works out which account can actually cover a payment.
 * Prefers the one the item is assigned to; falls back to whichever holds
 * enough; splits across both if neither can manage it alone.
 * Returns a list of {acct, amount} to post.
 */
function routePayment(amt, prefId){
  const pref=prefId||DEF_ACCT;
  const list=accts().map(a=>({id:a.id, bal:acctBalance(a.id)}));
  const p=list.find(a=>a.id===pref) || list[0];
  if(!p) return [{acct:pref, amount:amt, why:"only"}];

  if(p.bal>=amt) return [{acct:p.id, amount:amt, why:"preferred"}];

  const others=list.filter(a=>a.id!==p.id).sort((a,b)=>b.bal-a.bal);
  const covers=others.find(a=>a.bal>=amt);
  if(covers) return [{acct:covers.id, amount:amt, why:"switched", short:p.bal}];

  // nobody can cover it alone — take what the preferred account holds, rest from the next best
  const fromPref=Math.max(0,Math.min(amt,p.bal));
  const rest=Math.round((amt-fromPref)*100)/100;
  const out=[];
  if(fromPref>0) out.push({acct:p.id, amount:Math.round(fromPref*100)/100, why:"split"});
  if(rest>0){
    const next=others[0];
    out.push({acct: next?next.id:p.id, amount:rest, why: next?"split":"overdrawn"});
  }
  return out.length?out:[{acct:p.id, amount:amt, why:"overdrawn"}];
}

/** One tap: log whatever is still outstanding, or clear the lot. */
function toggleSettle(id,mk,kind){
  const list = kind==="in" ? state.income : state.payments;
  const it = list.find(x=>x.id===id); if(!it) return;

  if(settled(id,mk)){                       // fully done — tapping again clears it
    state.tx = state.tx.filter(t=>!(t.link && t.link.itemId===id && t.link.month===mk));
    save(); render(); toast("Cleared · balance "+money(balanceNow()));
    return;
  }
  const amt = remainingFor(it,mk);
  if(amt<=0){ toast("Set an amount for this month first"); return; }

  const dueDate = iso(mk,clampDay(mk,it.day));
  const date = dueDate > todayISO() ? todayISO() : dueDate;
  const wasPartial = partly(id,mk);

  const base=it.name+(wasPartial?" (rest of it)":"");
  if(kind==="in"){
    const into=it.acct||DEF_ACCT;
    state.tx.push({ id:"t"+Date.now(), date, amount:amt, desc:base, cat:null,
                    acct:into, link:{itemId:id,month:mk} });
    save(); render();
    toast("Received "+money(amt)+" into "+acctName(into)+" · "+money(acctBalance(into)));
    return;
  }

  const plan=routePayment(amt, it.acct||DEF_ACCT);
  plan.forEach((leg,i)=>{
    state.tx.push({ id:"t"+Date.now()+"-"+i, date, amount:-leg.amount,
                    desc: base+(plan.length>1?" ("+acctName(leg.acct)+" share)":""),
                    cat:null, acct:leg.acct, link:{itemId:id,month:mk} });
  });
  save(); render();

  if(plan.length>1){
    toast("Paid "+money(amt)+" · "+plan.map(l=>money(l.amount)+" from "+acctName(l.acct)).join(" and "));
  }else if(plan[0].why==="switched"){
    toast(acctName(it.acct||DEF_ACCT)+" only had "+money(plan[0].short)
          +" — paid "+money(amt)+" from "+acctName(plan[0].acct)+" instead");
  }else if(plan[0].why==="overdrawn"){
    toast("Paid "+money(amt)+" from "+acctName(plan[0].acct)
          +" — that takes it to "+money(acctBalance(plan[0].acct)));
  }else{
    toast("Paid "+money(amt)+" from "+acctName(plan[0].acct)+" · "+money(acctBalance(plan[0].acct)));
  }
}

/* ==========================================================
   INTERACTION
   ========================================================== */
function wire(){
  const $=id=>document.getElementById(id);
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);

  on("[data-tab]",b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
  on("[data-banktap]",b=>{
    b.onclick=()=>{
      const id=b.dataset.banktap, now=Date.now();
      if(tapAcct===id && now-tapTime<420){ tapAcct=null; openTransferTo(id); }
      else { tapAcct=id; tapTime=now; }
    };
    b.ondblclick=()=>{ tapAcct=null; openTransferTo(b.dataset.banktap); };
  });
  on("[data-cfiday]",b=>b.onclick=()=>openCfiDay(b.dataset.cfiday));
  on("[data-cfijump]",b=>b.onclick=()=>{ cfiMonth=Number(b.dataset.cfijump); render(); window.scrollTo(0,0); });
  on("[data-cfidelflow]",b=>b.onclick=()=>{
    const fid=b.dataset.cfidelflow;
    const linked=state.tx.filter(t=>t.cfiFlow===fid);
    if(linked.length && !confirm("This also removes the "+money(linked.reduce((s2,t)=>s2+t.amount,0))
       +" AED entry it created in your cash flow. Remove both?")) return;
    state.cfi.flows=state.cfi.flows.filter(f=>f.id!==fid);
    state.tx=state.tx.filter(t=>t.cfiFlow!==fid);
    save(); render(); toast("Removed");
  });
  if($("cfi-prev")) $("cfi-prev").onclick=()=>{ cfiMonth=Math.max(0,cfiMonth-1); render(); window.scrollTo(0,0); };
  if($("cfi-next")) $("cfi-next").onclick=()=>{ cfiMonth=Math.min(cfiRange().length-1,cfiMonth+1); render(); window.scrollTo(0,0); };
  if($("cfi-addflow")) $("cfi-addflow").onclick=openCfiFlow;
  if($("ab-menu")) $("ab-menu").onclick=()=>{ lastTab=tab; tab="setup"; render(); window.scrollTo(0,0); };
  if($("ab-back")) $("ab-back").onclick=()=>{ tab=lastTab||"today"; render(); window.scrollTo(0,0); };
  on("[data-jump]",b=>b.onclick=()=>{ curMonth=Number(b.dataset.jump); render(); window.scrollTo(0,0); });
  if($("prev")) $("prev").onclick=()=>{ curMonth=Math.max(0,curMonth-1); render(); window.scrollTo(0,0); };
  if($("next")) $("next").onclick=()=>{ curMonth=Math.min(monthKeys().length-1,curMonth+1); render(); window.scrollTo(0,0); };
  if($("prev2")) $("prev2").onclick=()=>{ curMonth=Math.max(0,curMonth-1); render(); };
  if($("next2")) $("next2").onclick=()=>{ curMonth=Math.min(monthKeys().length-1,curMonth+1); render(); };

  on("[data-tick]",b=>b.onclick=()=>{
    const [id,mk,kind]=b.dataset.tick.split("|");
    toggleSettle(id,mk,kind);
  });

  on("[data-edit]",el=>el.onclick=()=>{
    const [id,mk,kind]=el.dataset.edit.split("|");
    const list=kind==="in"?state.income:state.payments;
    const it=list.find(x=>x.id===id);
    if(settled(id,mk)){ toast("Fully logged — tap the tick to clear it"); return; }
    confAcct=null; openConfirm(it,mk,kind);
  });

  on("[data-deltx]",b=>b.onclick=()=>{
    const gone=state.tx.find(x=>x.id===b.dataset.deltx);
    if(gone && gone.att) delFile(gone.att.id).catch(()=>{});
    state.tx=state.tx.filter(x=>x.id!==b.dataset.deltx);
    save(); render(); toast("Deleted");
  });

  on("[data-att]",b=>b.onclick=()=>openAttSheet(b.dataset.att));

  on("[data-amt]",el=>el.onchange=()=>{
    const [id,kind]=el.dataset.amt.split("|");
    const list=kind==="in"?state.income:state.payments;
    const it=list.find(x=>x.id===id);
    it.amounts[monthKeys()[curMonth]] = el.value===""?0:Number(el.value);
    save(); render();
  });

  on("[data-delitem]",b=>b.onclick=()=>{
    const [id,kind]=b.dataset.delitem.split("|");
    const list=kind==="in"?state.income:state.payments;
    const it=list.find(x=>x.id===id);
    if(!confirm("Remove "+it.name+" from every month?")) return;
    if(kind==="in") state.income=state.income.filter(x=>x.id!==id);
    else state.payments=state.payments.filter(x=>x.id!==id);
    save(); render();
  });

  on("[data-theme-set]",b=>b.onclick=()=>{
    state.theme=b.dataset.themeSet; applyTheme(); save(); render();
  });

  on("[data-rename]",el=>el.onclick=()=>{
    const [id,kind]=el.dataset.rename.split("|");
    openRename(id,kind);
  });

  on("[data-cnt]",b=>b.onclick=()=>{
    const [id,on]=b.dataset.cnt.split("|");
    const it=state.income.find(x=>x.id===id); if(!it) return;
    it.count = on==="1";
    save(); render();
  });

  if($("cfi-open")) $("cfi-open").onchange=e=>{ cfiInit(); state.cfi.opening=Number(e.target.value)||0; save(); render(); };
  if($("cfi-date")) $("cfi-date").onchange=e=>{ cfiInit(); state.cfi.openingDate=e.target.value; save(); render(); };
  if($("cfi-week")) $("cfi-week").onchange=e=>{ cfiInit(); state.cfi.weeklyTarget=Math.max(0,Number(e.target.value)||0); save(); render(); };
  if($("cfi-rate")) $("cfi-rate").onchange=e=>{ cfiInit(); state.cfi.rate=Math.max(0,Number(e.target.value)||0); save(); render(); };
  if($("cfi-target")) $("cfi-target").onchange=e=>{ cfiInit(); state.cfi.target=Math.max(0,Number(e.target.value)||0); save(); render(); };
  on("[data-acctopen]",el=>el.onchange=()=>{
    const a=acctOf(el.dataset.acctopen); if(!a) return;
    a.opening=Number(el.value)||0;
    state.anchor.balance=accts().reduce((s2,x)=>s2+(Number(x.opening)||0),0);
    save(); render();
  });
  if($("a-date")) $("a-date").onchange=e=>{ state.anchor.date=e.target.value; save(); render(); };
  if($("fillbudget")) $("fillbudget").onclick=()=>{
    const src=$("fillbudget").dataset.src, o=spentByCat(src);
    const cats=Object.keys(o);
    if(!cats.length){ toast("Nothing logged in that month"); return; }
    if(!confirm("Replace the budgets above with what you actually spent in "+monthLabel(src)+"?")) return;
    state.budgets={};
    cats.forEach(c=>{ const v=Math.round(o[c]); if(v>0) state.budgets[c]=v; });
    save(); render(); toast("Budgets set from "+monthLabel(src));
  };

  if($("b-cat")){
    const sel=$("b-cat"), amt=$("b-amt");
    const load=()=>{ const v=(state.budgets||{})[sel.value]; amt.value=v?v:""; };
    load();
    sel.onchange=load;
    const commit=()=>{
      if(!state.budgets) state.budgets={};
      const c=sel.value, v=Number(amt.value);
      if(!v||v<=0) delete state.budgets[c]; else state.budgets[c]=v;
      save(); render();
      const s2=$("b-cat"); if(s2){ s2.value=c; const a2=$("b-amt"); if(a2) a2.value=v>0?v:""; }
      toast(v>0?c+" budgeted at "+money(v):c+" budget removed");
    };
    $("b-set").onclick=commit;
    amt.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); commit(); } };
  }
  on("[data-pickbudget]",el=>el.onclick=()=>{
    const sel=$("b-cat"); if(!sel) return;
    sel.value=el.dataset.pickbudget;
    const a=$("b-amt"); if(a){ a.value=(state.budgets||{})[sel.value]||""; a.focus(); }
  });
  on("[data-delbudget]",b=>b.onclick=()=>{
    delete state.budgets[b.dataset.delbudget];
    save(); render(); toast("Removed");
  });
  if($("reconcile")) $("reconcile").onclick=openReconcile;
  if($("add-in")) $("add-in").onclick=()=>addItem("in");
  if($("add-out")) $("add-out").onclick=()=>addItem("out");
  if($("copyfwd")) $("copyfwd").onclick=copyForward;
  if($("selftest")) $("selftest").onclick=selfTest;
  if($("allbills")) $("allbills").onclick=exportAllBills;
  if($("reminders")) $("reminders").onclick=exportReminders;
  if($("export")) $("export").onclick=exportAll;
  if($("backup")) $("backup").onclick=()=>{
    const text=JSON.stringify(state);
    const done=()=>toast("Backed up — paste it somewhere safe");
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));
    else fallbackCopy(text,done);
  };
  if($("restore")) $("restore").onclick=()=>{
    const raw=prompt("Paste your backup here. This replaces everything currently in the app.");
    if(!raw) return;
    try{
      const parsed=JSON.parse(raw);
      if(!parsed || !parsed.anchor || !Array.isArray(parsed.income)) throw new Error("shape");
      state=parsed;
      if(!Array.isArray(state.tx)) state.tx=[];
      state.income.forEach(it=>{
    if(it.count===undefined) it.count = !(it.id==="i2"||it.id==="i3");   // salary and the repayments start off
  });
  cfiInit();
  cfiMonth=Math.max(0,cfiRange().indexOf(monthOf(todayISO())));
  if(!state.theme) state.theme="auto";
      applyTheme(); save(); render(); toast("Restored");
    }catch(e){ toast("That doesn't look like a backup"); }
  };
  if($("reset")) $("reset").onclick=()=>{
    if(!confirm("Delete your log and go back to the original spreadsheet figures?")) return;
    state=defaultState(); curMonth=0; tab="today"; save(); render(); toast("Reset");
  };
}

/* ---------- add-spending sheet ---------- */
let sheetCat="Groceries", pendingFile=null, docMode=true, sheetMode="out", sheetIncomeId="",
    sheetAcct=DEF_ACCT, xferFrom="eib", xferTo="cbd";
function openSheet(html){
  document.getElementById("panel").innerHTML=html;
  document.getElementById("sheet").classList.add("open");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); }

function openAdd(){
  sheetCat="Groceries"; pendingFile=null; docMode=true;
  sheetMode="out"; sheetIncomeId=""; sheetAcct=DEF_ACCT;
  xferFrom=(accts()[0]||{}).id||"eib"; xferTo=(accts()[1]||{}).id||"cbd";
  drawAddSheet();
}

function drawAddSheet(){
  const isIn = sheetMode==="in";
  openSheet(`
    <h2>${isIn?"Log Income":"Log Spending"}</h2>
    <div class="seg" style="margin-bottom:14px">
      <button data-mode="out" class="${!isIn?"on":""}">Money out</button>
      <button data-mode="in" class="${isIn?"on":""}">Money in</button>
    </div>
    <input class="bigin" id="sp-amt" type="number" step="0.01" inputmode="decimal" placeholder="0" autofocus>
    ${isIn ? incomePicker()+accountPicker() : `
      <div class="chips" id="sp-cats">${CATS.map(c=>`<button class="chip ${c===sheetCat?"on":""}" data-cat="${c}">${c}</button>`).join("")}</div>
      <div id="sp-billwrap" style="display:none">
        <input type="file" id="sp-cam" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="sp-file" accept="image/*,application/pdf" style="display:none">
        <div class="btnrow" style="margin-top:12px">
          <button class="btn" id="sp-shoot">Scan the bill</button>
          <button class="btn" id="sp-pick">Choose a file</button>
        </div>
        <div class="chips" style="margin:10px 0 0">
          <button class="chip on" id="sp-doc" aria-pressed="true">Clean up as document</button>
        </div>
        <div id="sp-preview"></div>
        <p class="hint" id="sp-fname">Straight from the camera, or a photo or PDF you already have.</p>
      </div>
      ${accountPicker()}`}
    <input class="text" id="sp-desc" type="text" placeholder="Note (optional)">
    <div class="field"><label for="sp-date">Date</label><input id="sp-date" type="date" value="${todayISO()}"></div>
    <button class="btn solid wide" id="sp-save">Save</button>
    <button class="btn wide" data-close>Cancel</button>
  `);
  wireAddSheet();
}

/** Which bank the entry hits. */
function accountPicker(){
  return `<p class="sub" style="margin:14px 0 0">Account</p>
    <div class="chips" id="sp-acct" style="margin-top:6px">
      ${accts().map(a=>`<button class="chip ac ${a.id} ${a.id===sheetAcct?"on":""}" data-acct="${a.id}">${esc(a.name)} · ${money(acctBalance(a.id))}</button>`).join("")}
    </div>`;
}

/** Which planned income this belongs to, and what is still outstanding on it. */
function incomePicker(){
  const mk=monthOf(todayISO());
  const opts=state.income.filter(it=>plannedFor(it,mk)>0);
  const sel=opts.find(it=>it.id===sheetIncomeId);
  const left=sel?remainingFor(sel,mk):0;
  return `
    <div class="chips" id="sp-quick">
      <button class="chip" data-bump="500">+500</button>
      <button class="chip" data-bump="1000">+1,000</button>
      <button class="chip" data-bump="2000">+2,000</button>
      <button class="chip" data-bump="5000">+5,000</button>
      ${left>0?`<button class="chip" data-set="${left}">Rest, ${money(left)}</button>`:""}
      <button class="chip" data-bump="0">Clear</button>
    </div>
    <div class="chips" id="sp-inc">
      ${opts.map(it=>`<button class="chip ${it.id===sheetIncomeId?"on":""}" data-inc="${it.id}">${esc(it.name)}</button>`).join("")}
      <button class="chip ${sheetIncomeId===""?"on":""}" data-inc="">Other income</button>
    </div>
    <p class="hint" id="sp-incnote">${
      sel ? `${money(receivedFor(sel.id,mk))} of ${money(plannedFor(sel,mk))} in so far · <strong>${money(left)} still due</strong>. What you log here comes off that.`
          : "Not tied to anything scheduled — it just adds to the balance."
    }</p>`;
}

function wireAddSheet(){
  const p=document.getElementById("panel");
  const amtEl=p.querySelector("#sp-amt");
  const keep=()=>amtEl.value;

  p.querySelectorAll("[data-acct]").forEach(b=>b.onclick=()=>{
    sheetAcct=b.dataset.acct;
    p.querySelectorAll("[data-acct]").forEach(x=>x.classList.toggle("on",x.dataset.acct===sheetAcct));
  });
  p.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    const v=keep(); sheetMode=b.dataset.mode; drawAddSheet();
    const a=document.getElementById("sp-amt"); if(a) a.value=v;
  });

  if(sheetMode==="in"){
    p.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{
      const v=keep(); sheetIncomeId=b.dataset.inc; drawAddSheet();
      const a=document.getElementById("sp-amt"); if(a) a.value=v;
    });

    const mk=monthOf(todayISO());
    const sel=sheetIncomeId?state.income.find(x=>x.id===sheetIncomeId):null;
    const got=sel?receivedFor(sel.id,mk):0, plan=sel?plannedFor(sel,mk):0, left=sel?remainingFor(sel,mk):0;
    const note=p.querySelector("#sp-incnote");
    const updateNote=()=>{
      if(!note) return;
      const v=Number(amtEl.value)||0;
      if(!sel){ note.textContent="Not tied to anything scheduled — it just adds to the balance."; return; }
      note.innerHTML = v>0
        ? `${money(got)} of ${money(plan)} in so far. Logging ${money(v)} leaves <strong>${money(Math.max(0,left-v))} still due</strong>.`
        : `${money(got)} of ${money(plan)} in so far · <strong>${money(left)} still due</strong>. What you log here comes off that.`;
    };
    p.querySelectorAll("[data-bump]").forEach(b=>b.onclick=()=>{
      const inc=Number(b.dataset.bump);
      amtEl.value = inc===0 ? "" : String((Number(amtEl.value)||0)+inc);
      updateNote();
    });
    p.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{
      amtEl.value=String(Number(b.dataset.set)); updateNote();
    });
    amtEl.oninput=updateNote;
  }else{
    const billwrap=p.querySelector("#sp-billwrap"), fname=p.querySelector("#sp-fname");
    const preview=p.querySelector("#sp-preview"), docBtn=p.querySelector("#sp-doc");
    const showBill=()=>{ billwrap.style.display = sheetCat==="Bills" ? "block" : "none"; };
    showBill();
    p.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
      sheetCat=b.dataset.cat;
      p.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x.dataset.cat===sheetCat));
      showBill();
    });
    docBtn.onclick=()=>{ docMode=!docMode; docBtn.classList.toggle("on",docMode); docBtn.setAttribute("aria-pressed",docMode); };
    const camInput=p.querySelector("#sp-cam"), fileInput=p.querySelector("#sp-file");
    p.querySelector("#sp-shoot").onclick=()=>camInput.click();
    p.querySelector("#sp-pick").onclick=()=>fileInput.click();
    const took=(f)=>{
      if(!f) return;
      pendingFile=f; preview.innerHTML="";
      if(/^image\//.test(f.type||"")){
        const url=URL.createObjectURL(f);
        const im=document.createElement("img");
        im.src=url; im.className="shot"; im.alt="The bill you just captured";
        im.onload=()=>setTimeout(()=>URL.revokeObjectURL(url),20000);
        preview.appendChild(im);
        fname.textContent="Check it's readable before saving. Tap Scan again to retake.";
      }else{ fname.textContent=(f.name||"File")+" attached."; }
    };
    camInput.onchange=()=>took(camInput.files&&camInput.files[0]);
    fileInput.onchange=()=>took(fileInput.files&&fileInput.files[0]);
  }

  p.querySelector("#sp-save").onclick=async()=>{
    const v=Number(p.querySelector("#sp-amt").value);
    if(!v||v<=0){ toast("Enter an amount"); return; }
    const date=p.querySelector("#sp-date").value;
    const note=p.querySelector("#sp-desc").value.trim();
    const isIn=sheetMode==="in";
    const item=isIn&&sheetIncomeId ? state.income.find(x=>x.id===sheetIncomeId) : null;
    const tx={ id:"t"+Date.now(), date,
               amount: isIn ? Math.abs(v) : -Math.abs(v),
               desc: note || (isIn ? (item?item.name:"Income") : sheetCat),
               cat: isIn ? null : sheetCat, acct: sheetAcct,
               link: item ? {itemId:item.id, month:monthOf(date)} : null };
    if(!isIn && pendingFile && sheetCat==="Bills"){
      try{ tx.att=await storeAttachment(pendingFile,docMode); }
      catch(e){ toast(e.message==="too big"?"That file is too large":"Couldn't save the attachment"); }
    }
    state.tx.push(tx); pendingFile=null;
    save(); closeSheet(); render();
    if(item){
      const left=remainingFor(item,monthOf(date));
      toast(left>0 ? money(v)+" in · "+money(left)+" still due" : item.name+" now complete");
    }else{
      toast((isIn?"Added ":"Logged ")+money(v));
    }
  };
  bindClose();
  setTimeout(()=>{ const a=document.getElementById("sp-amt"); if(a) a.focus(); },60);
}

function openConfirm(it,mk,kind){
  const planned=plannedFor(it,mk), got=receivedFor(it.id,mk), left=remainingFor(it,mk);
  if(!confAcct) confAcct = kind==="in" ? (it.acct||DEF_ACCT)
                                       : routePayment(left||planned, it.acct||DEF_ACCT)[0].acct;
  const dueDate=iso(mk,clampDay(mk,it.day));
  const defDate=dueDate>todayISO()?todayISO():dueDate;
  openSheet(`
    <h2>${esc(it.name)}</h2>
    <p class="sub">Planned ${signed(kind==="in"?planned:-planned)} on ${dayLabel(dueDate)}.${got>0?` ${money(got)} already in — ${money(left)} outstanding.`:""} Enter what actually ${kind==="in"?"arrived":"went out"}; log the rest later as another entry.</p>
    <input class="bigin" id="c-amt" type="number" step="0.01" inputmode="decimal" value="${left||planned}">
    <p class="sub" style="margin:14px 0 0">${kind==="in"?"Landing in":"Coming out of"}</p>
    <div class="chips">${accts().map(a=>`<button class="chip ac ${a.id} ${a.id===confAcct?"on":""}" data-cacct="${a.id}">${esc(a.name)} · ${money(acctBalance(a.id))}</button>`).join("")}</div>
    <div class="field"><label for="c-date">Date</label><input id="c-date" type="date" value="${defDate}"></div>
    <button class="btn solid wide" id="c-save">${kind==="in"?"Mark received":"Mark paid"}</button>
    <button class="btn wide" data-close>Cancel</button>
  `);
  const p=document.getElementById("panel");
  p.querySelectorAll("[data-cacct]").forEach(b=>b.onclick=()=>{
    confAcct=b.dataset.cacct;
    p.querySelectorAll("[data-cacct]").forEach(x=>x.classList.toggle("on",x.dataset.cacct===confAcct));
  });
  p.querySelector("#c-save").onclick=()=>{
    const v=Math.abs(Number(p.querySelector("#c-amt").value)||0);
    state.tx.push({ id:"t"+Date.now(), date:p.querySelector("#c-date").value,
                    amount:kind==="in"?v:-v, desc:it.name, cat:null,
                    acct: confAcct||it.acct||DEF_ACCT, link:{itemId:it.id,month:mk} });
    const used=confAcct||it.acct||DEF_ACCT; confAcct=null;
    save(); closeSheet(); render();
    toast("Logged · "+acctName(used)+" now "+money(acctBalance(used)));
  };
  bindClose();
}

function openRename(id,kind){
  const list = kind==="in" ? state.income : state.payments;
  const it = list.find(x=>x.id===id); if(!it) return;
  openSheet(`
    <h2>Edit ${esc(it.name)}</h2>
    <p class="sub">Renaming keeps every entry already logged against it. Past entries keep the old name, which is what it was called at the time.</p>
    <input class="text" id="e-name" type="text" value="${esc(it.name)}" placeholder="Name">
    <div class="field"><label for="e-day">Due day of month</label>
      <input id="e-day" type="number" min="1" max="31" inputmode="numeric" value="${it.day}"></div>
    <p class="sub" style="margin:14px 0 0">Which account it ${kind==="in"?"lands in":"leaves from"}</p>
    <div class="chips">${accts().map(a=>`<button class="chip ac ${a.id} ${(it.acct||DEF_ACCT)===a.id?"on":""}" data-eacct="${a.id}">${esc(a.name)}</button>`).join("")}</div>
    <button class="btn solid wide" id="e-save">Save</button>
    <button class="btn wide" data-close>Cancel</button>
  `);
  const p=document.getElementById("panel");
  let pickAcct=it.acct||DEF_ACCT;
  p.querySelectorAll("[data-eacct]").forEach(b=>b.onclick=()=>{
    pickAcct=b.dataset.eacct;
    p.querySelectorAll("[data-eacct]").forEach(x=>x.classList.toggle("on",x.dataset.eacct===pickAcct));
  });
  p.querySelector("#e-save").onclick=()=>{
    const nm=p.querySelector("#e-name").value.trim();
    if(!nm){ toast("Give it a name"); return; }
    const d=Math.min(31,Math.max(1,parseInt(p.querySelector("#e-day").value,10)||it.day));
    it.name=nm; it.day=d; it.acct=pickAcct;
    save(); closeSheet(); render(); toast("Updated");
  };
  bindClose();
}


/* ---------- calendar reminders ---------- */
function icsEsc(t){ return String(t).replace(/([\\;,])/g,"\\$1").replace(/\n/g,"\\n"); }
function pad2(n){ return String(n).padStart(2,"0"); }

function exportReminders(){
  const mk=monthOf(todayISO()), today=todayISO();
  const now=new Date();
  const stamp=now.getUTCFullYear()+pad2(now.getUTCMonth()+1)+pad2(now.getUTCDate())+"T"
             +pad2(now.getUTCHours())+pad2(now.getUTCMinutes())+"00Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cash Flow//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  let n=0;
  state.payments.forEach(p=>{
    const amt=plannedFor(p,mk);
    let m=mk;
    if(iso(mk,clampDay(mk,p.day))<=today) m=addMonths(mk,1);   // start with the next one still ahead
    const dt=m.replace("-","")+pad2(clampDay(m,p.day))+"T090000";
    const label=p.name+(amt>0?" \u00b7 AED "+nf.format(amt):"");
    L.push("BEGIN:VEVENT",
      "UID:cashflow-"+p.id+"@cashflow.local",
      "DTSTAMP:"+stamp,
      "DTSTART:"+dt,
      "DURATION:PT30M",
      "RRULE:FREQ=MONTHLY;BYMONTHDAY="+p.day,
      "SUMMARY:"+icsEsc(label+" due"),
      "DESCRIPTION:"+icsEsc("Due today. Tick it off in your Cash Flow app once paid."),
      "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P1D",
      "DESCRIPTION:"+icsEsc(label+" due tomorrow"),
      "END:VALARM","END:VEVENT");
    n++;
  });
  L.push("END:VCALENDAR");
  downloadFile("cashflow-reminders.ics", L.join("\r\n"), "text/calendar;charset=utf-8");
  toast(n+" reminder"+(n===1?"":"s")+" exported");
}

function downloadFile(name,text,mime){
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime}));
    const a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
  }catch(e){ toast("Couldn't create the file here"); }
}

/** Double-tapping a bank pulls money into it from the other one. */
function openTransferTo(toId){
  const to=acctOf(toId), from=accts().find(a=>a.id!==toId);
  if(!from){ toast("You only have one account"); return; }
  const avail=acctBalance(from.id);
  openSheet(`
    <h2>Add Funds To ${esc(to.name)}</h2>
    <p class="sub">Moving from <span class="atag ${from.id}">${esc(from.name)}</span>, which holds ${money(avail)}.
      ${esc(to.name)} is at ${money(acctBalance(to.id))}.</p>
    <input class="bigin" id="mv-amt" type="number" step="0.01" inputmode="decimal" placeholder="0">
    <div class="chips">
      <button class="chip" data-mvbump="500">+500</button>
      <button class="chip" data-mvbump="1000">+1,000</button>
      <button class="chip" data-mvbump="5000">+5,000</button>
      ${avail>0?`<button class="chip" data-mvset="${avail}">All, ${money(avail)}</button>`:""}
      <button class="chip" data-mvbump="0">Clear</button>
    </div>
    <div id="mv-note" class="hint">Your total doesn't change — only which bank the money sits in.</div>
    <div class="field"><label for="mv-date">Date</label><input id="mv-date" type="date" value="${todayISO()}"></div>
    <button class="btn solid wide" id="mv-save">Move The Money</button>
    <button class="btn wide" data-close>Cancel</button>
  `);
  const p=document.getElementById("panel");
  const amt=p.querySelector("#mv-amt"), note=p.querySelector("#mv-note");
  const update=()=>{
    const v=Number(amt.value)||0;
    note.innerHTML = v<=0 ? "Your total doesn't change — only which bank the money sits in."
      : `${esc(from.name)} would go to <strong>${money(avail-v)}</strong> and ${esc(to.name)} to <strong>${money(acctBalance(to.id)+v)}</strong>.`
        + (v>avail?` <span style="color:var(--out)">That is more than ${esc(from.name)} holds.</span>`:"");
  };
  amt.oninput=update;
  p.querySelectorAll("[data-mvbump]").forEach(b=>b.onclick=()=>{
    const inc=Number(b.dataset.mvbump);
    amt.value = inc===0 ? "" : String((Number(amt.value)||0)+inc);
    update();
  });
  p.querySelectorAll("[data-mvset]").forEach(b=>b.onclick=()=>{ amt.value=String(Number(b.dataset.mvset)); update(); });
  p.querySelector("#mv-save").onclick=()=>{
    const v=Math.abs(Number(amt.value)||0);
    if(!v){ toast("Enter an amount"); return; }
    state.tx.push({ id:"t"+Date.now(), date:p.querySelector("#mv-date").value,
                    amount:v, desc:from.name+" → "+to.name, xfer:{from:from.id,to:to.id} });
    save(); closeSheet(); render();
    toast(money(v)+" moved · "+from.name+" "+money(acctBalance(from.id))
          +" · "+to.name+" "+money(acctBalance(to.id)));
  };
  bindClose();
  setTimeout(()=>{ const a=document.getElementById("mv-amt"); if(a) a.focus(); },60);
}

function openReconcile(){
  reconAcct=reconAcct||(accts()[0]||{}).id||DEF_ACCT;
  const bal=acctBalance(reconAcct);
  openSheet(`
    <h2>Reconcile</h2>
    <div class="chips">${accts().map(a=>`<button class="chip ac ${a.id} ${a.id===reconAcct?"on":""}" data-racct="${a.id}">${esc(a.name)}</button>`).join("")}</div>
    <p class="sub">This app says <strong>${money(bal)}</strong> in ${esc(acctName(reconAcct))}. What does the bank say?</p>
    <input class="bigin" id="r-amt" type="number" step="0.01" inputmode="decimal" placeholder="${bal.toFixed(2)}">
    <div id="r-diff" class="hint"></div>
    <button class="btn solid wide" id="r-save">Record the difference</button>
    <button class="btn wide" data-close>Cancel</button>
  `);
  const p=document.getElementById("panel");
  p.querySelectorAll("[data-racct]").forEach(b=>b.onclick=()=>{ reconAcct=b.dataset.racct; openReconcile(); });
  const inp=p.querySelector("#r-amt"), out=p.querySelector("#r-diff");
  inp.oninput=()=>{
    const v=Number(inp.value);
    out.textContent = inp.value===""?"" :
      (v===bal ? "Spot on — nothing to record."
               : (v>bal ? "You have "+money(v-bal)+" more than logged — something came in that isn't recorded."
                        : "You have "+money(bal-v)+" less than logged — spending that never got entered."));
  };
  p.querySelector("#r-save").onclick=()=>{
    if(inp.value===""){ toast("Enter the bank balance"); return; }
    const diff=Number(inp.value)-bal;
    if(diff===0){ closeSheet(); toast("Already matching"); return; }
    state.tx.push({ id:"t"+Date.now(), date:todayISO(), amount:diff,
                    desc:"Balance correction, "+acctName(reconAcct), cat:null,
                    acct:reconAcct, link:null, adj:true });
    save(); closeSheet(); render(); toast("Balance corrected");
  };
  bindClose();
  setTimeout(()=>inp.focus(),60);
}

function bindClose(){
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
}

function addItem(kind){
  const name=prompt(kind==="in"?"Income name":"Card or loan name"); if(!name) return;
  const day=Math.min(31,Math.max(1,parseInt(prompt("Day of month it's due (1–31)","1"),10)||1));
  const amounts={}; monthKeys().forEach(k=>amounts[k]=0);
  const it=kind==="in"?{id:"i"+Date.now(),count:true,name,day,amounts}:{id:"p"+Date.now(),name,day,amounts};
  (kind==="in"?state.income:state.payments).push(it);
  save(); render(); toast("Added — now set the amount");
}

function copyForward(){
  const keys=monthKeys(), from=keys[curMonth];
  if(!confirm("Copy every amount in "+monthLabel(from)+" to all later months?")) return;
  [...state.income,...state.payments].forEach(it=>{
    const v=Number(it.amounts[from])||0;
    keys.slice(curMonth+1).forEach(k=>it.amounts[k]=v);
  });
  save(); render(); toast("Copied forward");
}

function exportAll(){
  const lines=["Date\tItem\tAmount\tType"];
  state.tx.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>
    lines.push([t.date, t.desc||linkName(t.link&&t.link.itemId), Number(t.amount.toFixed(2)),
                t.adj?"correction":(t.link?"scheduled":"day-to-day")].join("\t")));
  lines.push("");
  lines.push("Month\tClosing balance\tLowest");
  monthKeys().forEach(k=>lines.push([monthLabel(k),Number(months[k].closing.toFixed(2)),Number(months[k].lowest.toFixed(2))].join("\t")));
  const text=lines.join("\n");
  const done=()=>toast("Copied — paste into Excel");
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("Couldn't copy here"); }
  document.body.removeChild(ta);
}

document.getElementById("fab").onclick=()=>{ if(tab==="cfi") openCfiDay(todayISO()); else openAdd(); };
document.getElementById("sheet").querySelector(".scrim").onclick=closeSheet;

function fatal(err){
  const app=document.getElementById("app");
  if(app) app.innerHTML=`<div class="top"><h1>Something Broke</h1>
    <p class="lead">The app hit an error while starting, so it stopped rather than show you wrong figures.</p></div>
    <div class="card alert"><h3>What happened</h3><p>${esc(String(err&&err.message||err))}</p></div>
    <section><p class="sub">Your data has not been touched. Send me that message and I'll fix it. If you need the app now, upload the previous version from your GitHub commit history.</p>
    <button class="btn wide" id="fatal-backup">Back up my data</button></section>`;
  const b=document.getElementById("fatal-backup");
  if(b) b.onclick=()=>{
    const text=JSON.stringify(state||{});
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("Backed up"),()=>{});
  };
  const fab=document.getElementById("fab"); if(fab) fab.style.display="none";
  const ab=document.getElementById("appbar"); if(ab) ab.innerHTML=`<span class="title">Cash Flow</span>`;
}

(async function(){
 try{
  await detectStores();
  const saved=await load();
  state = (saved && saved.v===2) ? saved : defaultState();
  monthKeys().forEach(k=>{
    [...state.income,...state.payments].forEach(it=>{ if(it.amounts[k]===undefined) it.amounts[k]=0; });
  });
  if(!Array.isArray(state.tx)) state.tx=[];
  state.income.forEach(it=>{
    if(it.count===undefined) it.count = !(it.id==="i2"||it.id==="i3");   // salary and the repayments start off
  });
  cfiInit();
  cfiMonth=Math.max(0,cfiRange().indexOf(monthOf(todayISO())));
  if(!state.theme) state.theme="auto";
  extendHorizon();
  const here=monthKeys().indexOf(monthOf(todayISO()));
  if(here>=0) curMonth=here;
  applyTheme();
  render();
 }catch(err){ fatal(err); }
})();
</script>
